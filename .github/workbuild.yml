
name: Build Troll Buddy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TrollBuddyAndroid_Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip TrollBuddyAndroid_Source.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Troll-Buddy-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
